<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Sampling Tool</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "color-convert": "https://cdn.jsdelivr.net/npm/color-convert@2.0.2/index.js"
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Color Sampling Tool</h1>

        <div class="input-area">
            <label for="imageUpload" class="button">Upload Image</label>
            <input type="file" id="imageUpload" accept="image/*">
            <span>or paste image directly</span>
        </div>

        <div class="image-container">
            <canvas id="imageCanvas"></canvas>
        </div>

        <div class="controls">
            <button id="eyedropperToggle">Activate Eyedropper</button>
            <span id="eyedropperStatus">Inactive</span>
        </div>

        <h2>Color Palette</h2>
        <div id="palette">
            <p>No colors sampled yet.</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
